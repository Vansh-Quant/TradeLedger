name: TradeLedger CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, audit, and workstation build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use npm 11
        run: npm install --global npm@11

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Run typechecks and tests
        run: npm run check

      - name: Build workstation
        run: npm run build --workspace packages/workstation-glass
